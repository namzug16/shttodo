services:
  shttodo:
    build: .
    restart: unless-stopped
    ports:
      # Localhost only. Tailscale Serve exposes it to the tailnet; nothing is public.
      - "127.0.0.1:${SHTTODO_HOST_PORT:-3101}:8080"
    environment:
      SHTTODO_API_TOKEN: ${SHTTODO_API_TOKEN:?set SHTTODO_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-60}
      REMINDER_ACTIVE_HOURS: ${REMINDER_ACTIVE_HOURS:-09-21}
      TZ: ${TZ:-UTC}
      REMINDER_AGENT_COMMAND: ${REMINDER_AGENT_COMMAND:-}
      REMINDER_AGENT_PROMPT: ${REMINDER_AGENT_PROMPT:-}
    volumes:
      - shttodo-data:/data

volumes:
  shttodo-data:
